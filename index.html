<title>పేదరాశి పెద్దమ్మ</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0d0d0f;color:#f5f5f5;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.card{text-align:center;padding:28px;max-width:560px;width:100%}
.small{color:#888;font-size:14px;margin-bottom:18px}
#text{font-size:30px;line-height:1.35;min-height:90px;display:grid;place-items:center}
.big{font-size:42px;font-weight:800;letter-spacing:-1px;margin:10px 0}
.choices{display:flex;gap:14px;justify-content:center;margin-top:24px}
button{border:0;border-radius:999px;padding:14px 22px;font-size:17px;cursor:pointer;background:#fff;color:#111;min-width:150px}
button:hover{transform:translateY(-1px)}
.hidden{display:none}
.photo{width:min(360px,88vw);max-height:470px;object-fit:cover;border-radius:24px;display:block;margin:0 auto 22px;box-shadow:0 14px 45px rgba(0,0,0,.45);animation:fadeIn .8s ease}
.message{font-size:28px;font-weight:750}
.sub{color:#999;font-size:15px;margin-top:10px}
@keyframes fadeIn{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
</style>
</head>

function imageUrl(dataUrl){
  if(dataUrl.startsWith('data:image/svg+xml')) return dataUrl;
  const base64=dataUrl.split(',')[1];
  const binary=atob(base64);
  const bytes=new Uint8Array(binary.length);
  for(let i=0;i<binary.length;i++) bytes[i]=binary.charCodeAt(i);
  return URL.createObjectURL(new Blob([bytes],{type:'image/jpeg'}));
}
function show(type){
  choices.style.display='none';
  small.textContent='';
  const photo=type==='morning' ? imageUrl(morningPhoto) : imageUrl(nightPhoto);
  if(type==='morning'){
    text.innerHTML='<img class="photo" src="'+photo+'" alt="Morning"><div class="message">Good morning, పేదరాశి పెద్దమ్మ ☀️</div><div class="sub">Have a great day :)</div>';
  }else{
    text.innerHTML='<img class="photo" src="'+photo+'" alt="Night"><div class="message">Good night, పేదరాశి పెద్దమ్మ 🌙</div><div class="sub">Sleep well :)</div>';
  }
}
document.getElementById('morning').onclick=()=>show('morning');
document.getElementById('night').onclick=()=>show('night');
