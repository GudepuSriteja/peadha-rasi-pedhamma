<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Movie Recommendation Machine</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at top,#20202a 0,#0c0c10 55%,#070709 100%);color:#f5f5f7;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.card{width:min(92vw,620px);padding:34px 26px;text-align:center}
.kicker{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:#888;margin-bottom:14px}
h1{font-size:clamp(30px,7vw,48px);line-height:1.05;margin:0 0 12px;letter-spacing:-1.5px}
.sub{color:#999;line-height:1.5;font-size:15px;margin:0 auto 28px;max-width:470px}
.question{font-size:23px;font-weight:700;margin:20px 0}
.options{display:grid;gap:10px}
button{width:100%;border:1px solid #303038;background:#17171d;color:#f5f5f7;border-radius:14px;padding:15px 16px;font-size:16px;cursor:pointer;transition:.18s}
button:hover{transform:translateY(-2px);background:#22222a;border-color:#555}
.progress{height:3px;background:#25252c;border-radius:10px;overflow:hidden;margin:0 auto 28px;max-width:420px}
#bar{height:100%;width:25%;background:#fff;transition:.25s}
.result{display:none}
.result h2{font-size:28px;margin:10px 0}
.movie{padding:18px;margin:12px 0;background:#15151b;border:1px solid #292931;border-radius:16px;text-align:left}
.movie strong{font-size:18px}
.movie span{display:block;color:#999;font-size:14px;margin-top:5px;line-height:1.45}
.note{margin-top:26px;color:#aaa;font-size:14px;line-height:1.55}
.hidden{display:none}
#easter{margin-top:24px;font-size:12px;color:#555;cursor:pointer}
</style>
</head>
<body>
<main class="card">
  <section id="quiz">
    <div class="kicker">A highly scientific experiment</div>
    <h1>Movie Recommendation Machine</h1>
    <p class="sub">Because apparently normal movie recommendations weren't enough.</p>
    <div class="progress"><div id="bar"></div></div>
    <div id="question" class="question"></div>
    <div id="options" class="options"></div>
  </section>

  <section id="result" class="result">
    <div class="kicker">Analysis complete</div>
    <h2 id="headline"></h2>
    <p class="sub" id="analysis"></p>
    <div id="movies"></div>
    <p class="note">You don't actually want a movie.<br>You want to feel something.</p>
    <button id="again">Run the analysis again</button>
    <div id="easter">there may be one more thing here</div>
  </section>
</main>

<script>
const questions=[
 {q:"What do you want to feel?",a:["Fall in love","Cry a little","Think about life at 2 AM","All of the above"]},
 {q:"How much emotional damage are you willing to take?",a:["Mild","Medium","Destroy me"]},
 {q:"What matters most in a story?",a:["Genuine people","Family","Love","The human side of things"]},
 {q:"Pick your ideal ending.",a:["Heartwarming","Bittersweet","Make me stare at the ceiling","I just want it to feel real"]}
];

let step=0,answers=[];
const qEl=document.getElementById("question");
const optEl=document.getElementById("options");
const bar=document.getElementById("bar");

function render(){
  const q=questions[step];
  qEl.textContent=q.q;
  optEl.innerHTML="";
  q.a.forEach((answer,i)=>{
    const b=document.createElement("button");
    b.textContent=answer;
    b.onclick=()=>choose(i,answer);
    optEl.appendChild(b);
  });
  bar.style.width=((step+1)/questions.length*100)+"%";
}
function choose(i,answer){
  answers.push(answer);
  step++;
  if(step<questions.length) render();
  else finish();
}
function finish(){
  document.getElementById("quiz").style.display="none";
  document.getElementById("result").style.display="block";

  const all=answers.join(" ").toLowerCase();
  let movies;
  let headline="Your taste is dangerously specific.";
  let analysis="You like stories where people actually feel things, say what they mean, and somehow leave you thinking about the characters after the movie ends.";

  if(all.includes("destroy")||all.includes("ceiling")||all.includes("cry")){
    movies=[
      ["Voicemails for Isabelle","If this one is still running in your head, apparently the machine has decided not to fight it."],
      ["About Time","Love, family, ordinary days, and the kind of ending that stays with you."],
      ["Past Lives","Quiet, complicated, and very human."]
    ];
  }else if(all.includes("family")||all.includes("genuine")||all.includes("human")){
    movies=[
      ["The Lunchbox","Two strangers, ordinary lives, and a connection that grows in the smallest way."],
      ["Little Miss Sunshine","Messy family, real people, and a ridiculous amount of heart."],
      ["The Intouchables","Friendship, humour and two people changing each other's lives."]
    ];
  }else{
    movies=[
      ["About Time","Romance, family and learning to appreciate ordinary life."],
      ["Begin Again","Music, people finding themselves, and a connection that feels natural."],
      ["The Secret Life of Walter Mitty","A little more life, a little less overthinking."]
    ];
  }

  document.getElementById("headline").textContent=headline;
  document.getElementById("analysis").textContent=analysis;
  document.getElementById("movies").innerHTML=movies.map(m=>'<div class="movie"><strong>'+m[0]+'</strong><span>'+m[1]+'</span></div>').join("");
}
document.getElementById("again").onclick=()=>{step=0;answers=[];document.getElementById("result").style.display="none";document.getElementById("quiz").style.display="block";render()};
document.getElementById("easter").onclick=()=>{
  document.getElementById("easter").textContent="P.S. You started this whole problem by making Sri watch Voicemails for Isabelle.";
};
render();
</script>
</body>
</html>
