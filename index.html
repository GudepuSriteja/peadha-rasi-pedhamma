</style>

function show(type){
  choices.style.display='none';
  small.textContent='';
  if(type==='morning'){
    text.innerHTML='<img class="photo" src="'+morningPhoto+'" alt="Morning"><div class="message">Good morning, peddha rasi pedhamma ☀️</div><div class="sub">Have a great day :)</div>';
  }else{
    text.innerHTML='<img class="photo" src="'+nightPhoto+'" alt="Night"><div class="message">Good night, peddha rasi pedhamma 🌙</div><div class="sub">Sleep well :)</div>';
  }
}
document.getElementById('morning').onclick=()=>show('morning');
document.getElementById('night').onclick=()=>show('night');
</script>
